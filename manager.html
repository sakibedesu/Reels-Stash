<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reel Stash</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .layout { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
    aside { border-right: 1px solid var(--line); padding: 20px 14px; background: var(--surface); position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    aside h1 { font-size: 18px; margin: 0 8px 16px; }
    .nav { display: flex; flex-direction: column; gap: 2px; }
    .nav button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; }
    .nav button:hover { background: var(--bg); }
    .nav button.active { background: var(--accent-soft); font-weight: 600; }
    .nav .n { color: var(--muted); font-weight: 400; }
    .add { display: flex; gap: 6px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
    .add input { flex: 1; }
    main { padding: 24px 28px; max-width: 880px; width: 100%; }
    .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .head h2 { margin: 0; font-size: 22px; }
    .tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .tools .search { flex: 1; min-width: 180px; }
    #list { display: flex; flex-direction: column; gap: 10px; }
    .item textarea { width: 100%; margin-top: 10px; resize: vertical; min-height: 38px; }
    .meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12px; color: var(--muted); }
    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
      aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      main { padding: 18px 14px; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside>
      <h1>Reel Stash</h1>
      <nav class="nav" id="nav" aria-label="Collections"></nav>
      <form class="add" id="addForm">
        <input class="field" id="newName" maxlength="40" placeholder="New collection" aria-label="New collection name">
        <button class="btn primary" type="submit">Add</button>
      </form>
    </aside>
    <main>
      <div class="head">
        <h2 id="title"></h2>
        <div id="colActions"></div>
      </div>
      <div class="tools">
        <input class="field search" id="search" type="search" placeholder="Search links and notes" aria-label="Search">
        <button class="btn" id="copyAll">Copy links</button>
        <button class="btn" id="exportTxt">Export .txt</button>
        <button class="btn" id="exportJson">Backup .json</button>
        <button class="btn" id="importBtn">Import .json</button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
      <div id="list"></div>
    </main>
  </div>
  <script src="shared.js"></script>
  <script src="manager.js"></script>
</body>
</html>
